services:
  demo-backend:
    image: ghcr.io/sadhukhantks/demobackend:latest
    build:
      context: .
    container_name: demo-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    networks:
      - vowerp

  demo-scheduler:
    image: ghcr.io/sadhukhantks/demobackend:latest
    container_name: demo-scheduler
    restart: unless-stopped
    command: uvicorn src.scheduler_main:app --host 0.0.0.0 --port 48480
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    networks:
      - vowerp

networks:
  vowerp:
    external: true
